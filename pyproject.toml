[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-legal-rag"
version = "0.1.0"
description = "Production-oriented Arabic Legal RAG service for querying the Egyptian Civil Code"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.8,<4.10",
    "fastapi>=0.115,<0.116",
    "google-genai",
    "psycopg[binary]",
    "sentence-transformers",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
