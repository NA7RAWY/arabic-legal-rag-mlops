events {}

http {
    upstream legal_rag_backends {
        # Open-source nginx uses weighted round-robin and passive failure checks.
        server stable:3000 weight=9 max_fails=2 fail_timeout=10s;
        server candidate:3000 weight=1 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        location = /ask/stream {
            proxy_pass http://legal_rag_backends;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://legal_rag_backends;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
